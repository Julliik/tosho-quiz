<style>
/* Один темний світ бренду: телефонна колонка до 480 px, фото-плитки, наліпки, золото для цін */
:root{
  --page:#0B0B0B; --bg:#121212; --card:#1B1B1B; --fg:#FFF9F8;
  --muted:rgba(255,249,248,.74); --soft:rgba(255,249,248,.58); --line:rgba(255,249,248,.16);
  --gold:#C5A880; --pink:#F8A4B8; --ink:#121212;
  --display:'Unbounded','Arial Black',system-ui,sans-serif;
  --text:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--page)}
body{margin:0;color:var(--fg);font-family:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img{max-width:100%;display:block}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column}
@media (min-width:520px){.app{border-left:1px solid #222;border-right:1px solid #222}}
#screen{flex:1;display:flex;flex-direction:column;transition:opacity .2s ease}
#view.fade{opacity:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);height:56px;display:flex;align-items:center;gap:10px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.back{width:44px;height:44px;flex:none;border:0;border-radius:12px;background:transparent;color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer}
.bar{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.bar i{height:4px;border-radius:2px;background:rgba(255,249,248,.15)}
.bar i.on{background:var(--gold)}
.count{min-width:30px;text-align:right;font:600 12px/1 var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.toptitle{flex:1;text-align:center;font-size:13px;color:var(--soft)}
.sp44{width:44px;flex:none}
.body{flex:1;display:flex;flex-direction:column;gap:14px;padding-block:20px 28px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2{margin:0;font-family:var(--display);font-weight:800;text-transform:uppercase;text-wrap:balance}
h1{font-size:clamp(24px,7.4vw,30px);line-height:1.1}
h2{font-size:22px;line-height:1.18}
h1:focus,h2:focus{outline:none}
.gold{color:var(--gold)}
.lead{margin:0;font-size:15px;line-height:1.5;color:var(--muted);max-width:65ch}
.hint{margin:-6px 0 2px;font-size:13px;color:var(--muted)}
.small{margin:0;font-size:13px;line-height:1.45;color:var(--soft)}
.center{text-align:center}
.spacer{flex:1;min-height:8px}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* Відповіді */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;flex-direction:column;gap:4px;width:100%;min-height:60px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--fg);font:inherit;text-align:left;cursor:pointer;transition:border-color .15s ease,transform .15s ease}
.opt:hover{border-color:rgba(255,249,248,.42)}
.opt:active{transform:scale(.99)}
.opt[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.opt .t{font:600 15px/1.25 var(--display)}
.opt .s{font-size:13px;line-height:1.4;color:var(--muted)}
.opt.dash{border:1px solid rgba(248,164,184,.6);background:transparent}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;aspect-ratio:17/15;max-width:100%;padding:8px;border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;color:var(--fg);font:inherit;text-align:left;cursor:pointer;transition:transform .15s ease}
.tile:active{transform:scale(.98)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .plate{position:relative;display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:10px;background:rgba(18,18,18,.86)}
.tile .t{font:600 14px/1.2 var(--display)}
.tile .s{font-size:11.5px;line-height:1.3;color:rgba(255,249,248,.82)}
.tile[aria-pressed="true"]{border:3px solid var(--fg);padding:6px}
.tile .check{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--pink);display:none;align-items:center;justify-content:center}
.tile[aria-pressed="true"] .check{display:flex}
.tile.wide{grid-column:1/-1;aspect-ratio:auto;min-height:64px}
.mkline{margin:0;font-size:13px;line-height:1.45;color:var(--muted)}
.tile.dash{border:1px solid rgba(248,164,184,.6);background:transparent;align-items:center;justify-content:center;font:600 15px/1.2 var(--display);text-align:center}

.fmt{display:flex;flex-direction:column;padding:0;border:2px solid var(--gold);border-radius:18px;overflow:hidden;background:var(--card);color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.fmt[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.fmt .ph{position:relative;display:block;width:100%;aspect-ratio:350/196;max-width:100%}
.fmt .ph img{width:100%;height:100%;object-fit:cover}
.fmt .ph .sticker{position:absolute;left:12px;top:12px;background:var(--gold)}
.fmt .in{display:flex;flex-direction:column;gap:6px;padding:14px 16px 16px}
.fmt .t{font:600 17px/1.2 var(--display)}
.fmt .s{font-size:13px;line-height:1.4;color:var(--muted)}
.fmt .g{font-size:12px;line-height:1.35;color:var(--gold)}
.fmtrow{display:flex;align-items:center;gap:14px;padding:10px 14px 10px 10px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.fmtrow[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.fmtrow img{width:88px;height:88px;flex:none;border-radius:12px;object-fit:cover}
.fmtrow .tx{display:flex;flex-direction:column;gap:6px;min-width:0}
.fmtrow .t{font:600 15px/1.2 var(--display)}
.fmtrow .s{font-size:13px;line-height:1.4;color:var(--muted)}

/* Кнопки й наліпки */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:0 20px;border:0;border-radius:999px;background:var(--fg);color:var(--ink);font:600 15px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em;text-decoration:none;text-align:center;cursor:pointer}
.btn:disabled{opacity:.6;cursor:default}
.btn2{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;padding:0 20px;border:1.5px solid rgba(255,249,248,.3);border-radius:999px;background:transparent;color:var(--fg);font:600 15px/1.2 var(--text);text-decoration:none;text-align:center;cursor:pointer}
.link{align-self:center;padding:10px;border:0;background:none;color:var(--gold);font:500 14px var(--text);text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.sticker{display:inline-block;padding:6px 12px;border-radius:999px;background:var(--pink);color:var(--ink);font:700 12px/1.2 var(--text)}
.tilt-r{transform:rotate(4deg)}
.tilt-l{transform:rotate(-3deg)}

/* Старт */
.logobar{height:72px;display:flex;align-items:center;justify-content:space-between;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.logo{width:160px;height:auto}
.pola{position:relative;height:290px;margin-left:max(16px,env(safe-area-inset-left,0px));margin-right:max(16px,env(safe-area-inset-right,0px))}
.pola .a,.pola .b{position:absolute;border:6px solid var(--fg);background:#222;overflow:hidden}
.pola .a{left:2%;top:12px;width:62%;max-width:240px;aspect-ratio:22/25;transform:rotate(-5deg)}
.pola .b{right:2%;top:48px;width:50%;max-width:190px;aspect-ratio:18/21;transform:rotate(6deg)}
.pola img{width:100%;height:100%;object-fit:cover}
.ten{position:absolute;right:16px;top:6px;width:64px;height:64px;border-radius:50%;background:var(--gold);color:var(--ink);display:flex;align-items:center;justify-content:center;font:800 16px/1 var(--display);transform:rotate(-10deg)}

/* Підсумок */
.banner{position:relative;width:100%;aspect-ratio:342/150;max-width:100%;border-radius:16px;overflow:hidden;background:var(--card)}
.banner img{width:100%;height:100%;object-fit:cover}
.banner .sticker{position:absolute;left:12px;top:12px}
.price{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 8px}
.price b{font:800 44px/1 var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.price .cur{font-weight:600;font-size:16px;color:var(--gold)}
.price .dim{font-size:16px;color:var(--muted)}
.price .sticker{align-self:center}
.card{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:16px;background:var(--card)}
.card .lbl{font-size:12px;color:var(--gold)}
.card .nm{font:600 16px/1.25 var(--display)}
.card .p{font:800 20px/1.1 var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.card .s{font-size:13px;line-height:1.4;color:var(--muted)}
.prog{display:flex;flex-direction:row;gap:12px;align-items:flex-start}
.prog img{width:56px;height:56px;flex:none;border-radius:10px;object-fit:cover}
.prog .tx{display:flex;flex-direction:column;gap:4px;min-width:0}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.steps li{display:flex;flex-direction:column;gap:8px;font-size:12px;line-height:1.35}
.steps b{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font:600 13px/1 var(--display);color:var(--gold)}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.notes li{position:relative;padding-left:16px;font-size:13px;line-height:1.45;color:var(--muted)}
.notes li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.downsell{margin:0;padding:12px 14px;border-radius:14px;border:1px solid rgba(197,168,128,.5);font-size:13px;line-height:1.45;color:var(--fg)}
.teaser{display:flex;flex-direction:column;gap:6px;width:100%;padding:14px 16px;border:1.5px solid var(--gold);border-radius:16px;background:transparent;color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.teaser .s{font-size:13px;line-height:1.4;color:var(--muted)}
.teaser .go{font:600 13px/1.2 var(--display);color:var(--gold);text-transform:uppercase}

/* Форма */
form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:13px;color:var(--muted)}
.field .sub{font-size:12px;color:var(--soft)}
input,textarea{width:100%;min-height:52px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);font:16px/1.4 var(--text)}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
input[aria-invalid="true"]{border-color:var(--pink)}
input[type="date"]{color-scheme:dark}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chip{min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--fg);font:600 14px/1.2 var(--text);cursor:pointer}
.chip[aria-checked="true"]{background:var(--fg);border-color:var(--fg);color:var(--ink)}
.err{margin:0;font-size:13px;color:var(--pink)}
.hp{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
.fail{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border:1px solid var(--pink);border-radius:16px}
.fail p{margin:0;font-size:14px;line-height:1.45}
.revwrap{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.revwrap h3{margin:0;font:600 15px/1.2 var(--display);text-transform:uppercase}
.revs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-left:calc(-1 * max(20px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(20px,env(safe-area-inset-right,0px)));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));scroll-padding-left:max(20px,env(safe-area-inset-left,0px));padding-bottom:4px}
.revs::-webkit-scrollbar{display:none}
.rev{flex:0 0 84%;max-width:340px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:18px;background:var(--card)}
.rev .who{display:flex;align-items:center;gap:10px}
.rev .av{width:36px;height:36px;flex:none;border-radius:50%;background:var(--gold);color:var(--ink);display:flex;align-items:center;justify-content:center;font:800 14px/1 var(--display)}
.rev .nm{display:block;font-weight:600;font-size:14px;line-height:1.2}
.rev .via{display:block;font-size:12px;color:var(--soft)}
.rev .b{align-self:flex-start;max-width:100%;margin:0;padding:10px 12px;border-radius:16px 16px 16px 4px;background:#2A2A2A;font-size:14px;line-height:1.45}
.revhint{margin:0;font-size:12px;color:var(--soft)}
.demo{margin:0;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--pink);color:var(--ink);font-size:12px;line-height:1.4;text-align:center}
@media (prefers-reduced-motion:reduce){#screen,.opt,.tile{transition:none}}
</style>
</head>
<body>
<div class="app">
  <main id="screen" aria-live="polite"></main>
  <p class="demo" id="demo" hidden>Демо-режим: заявки поки нікуди не надсилаються. Щоб вони йшли в Telegram, вкажіть адресу скрипта в CONFIG.endpoint.</p>
</div>
<script>
/* ====== НАЛАШТУВАННЯ ====== */
const CONFIG = {
  endpoint: 'https://script.google.com/macros/s/AKfycbyz7J5Y7_yDg06OeDRxnEz_Gv1y0oi7Xq3nm872boJd_I_1hvxFFjjpxDauUdE0UgSrZQ/exec',   // вебзастосунок Google Apps Script «ТОШО квіз: заявки»
  pixelId: '',    // ID пікселя Meta (README, крок 4)
  instagram: 'https://www.instagram.com/tosho_event/',
  telegram: '',   // посилання на Telegram для запасного зв'язку, наприклад https://t.me/назва
};

/* ====== ЦІНИ Й ЛОГІКА (аркуш «Прайс», 31.10.2026) ====== */
// LOGIC START
const TURNKEY_FROM = 80000;
const GAMES = {
  mafia:  { name: 'Мафія', price: 11500, max: 20, img: 'mafia', about: 'Наша версія з масками й кейсом: мешканці міста вираховують мафію серед своїх.' },
  trash:  { name: 'Треш-коктейль', price: 14500, max: 30, img: 'trash', hit: true, about: 'Дві команди крутять колесо фортуни й проходять виклики. Команда, що програла, п’є «треш-коктейль».' },
  stakes: { name: 'Ставки', price: 16500, max: 30, img: 'stakes', about: 'Казино з майстром гри в масці: дві команди ставлять фішки й ризикують раунд за раундом.' },
  cuffs:  { name: 'Кайданки', price: 16500, max: 30, img: 'cuffs', about: 'Гравці стають заручниками в кайданках і виборюють ключ завданнями з таємних боксів.' },
  guess:  { name: 'Вгадай, що всередині', price: 19500, max: 30, img: 'guess', about: 'Гра на сміливість: навпомацки вгадують, хто сидить у скрині. Тварини справжні.' }
};
const PAIRS = {
  'trash+mafia': 26000, 'stakes+mafia': 28000, 'cuffs+mafia': 28000, 'guess+mafia': 31000,
  'guess+trash': 34000, 'guess+stakes': 36000, 'guess+cuffs': 36000
};
const GUESTS = { G10: 10, G15: 15, G20: 20, G30: 30, G31: 31 };
const MK_BASE = 11000;   // майстер-клас до 10 учасників
const MK_EXTRA = 1100;   // за кожного учасника понад 10
const MK = {
  perfume:   { name: 'Парфумерна лабораторія', price: 11000, img: 'mk-perfume' },
  candle:    { name: 'Свічка', price: 11000, img: 'mk-candle' },
  affirm:    { name: 'Картина-афірмація', price: 11000, img: 'mk-affirm' },
  bearbrick: { name: 'Bearbrick', price: 11000, img: 'mk-bearbrick' },
  tshirt:    { name: 'Розпис футболок', price: 12500, img: 'mk-tshirt' } // у квізі поки не показуємо: щоб показати, додайте 'tshirt' у mkFor
};
// Найпопулярніші майстер-класи; порядок залежить від того, хто святкує
const mkFor = who => who === 'girl' ? ['perfume', 'candle', 'affirm', 'bearbrick'] : ['bearbrick', 'candle', 'perfume', 'affirm'];

function pickGame(a) {
  const n = GUESTS[a.guests] || 10;
  if (a.age === 'A8') return (a.vibe === 'intrigue' && n <= 20) ? 'mafia' : 'trash';
  const map = { risk: 'stakes', intrigue: 'mafia', dare: 'trash', escape: 'cuffs', surprise: 'guess', unsure: 'trash' };
  let g = map[a.vibe] || 'trash';
  if (g === 'mafia' && n > 20) g = 'trash';
  return g;
}
function pairFor(g, n) {
  if (n <= 20) return g === 'mafia' ? ['trash', 'mafia'] : [g, 'mafia'];
  return (g === 'trash' || g === 'guess') ? ['guess', 'trash'] : ['guess', g];
}
function compute(a) {
  if (a.age === 'U8') return { type: 'under8' };
  const n = GUESTS[a.guests] || 10;
  const g = pickGame(a);
  const pair = pairFor(g, n);
  const pairPrice = PAIRS[pair.join('+')];
  if (!pairPrice) throw new Error('Немає пари в прайсі: ' + pair.join('+'));
  const part2 = a.part2 || 'unsure';
  const mk = MK[a.mk] ? a.mk : null;
  const mkPrice = GAMES[g].price + (mk ? MK[mk].price : MK_BASE);
  const budgetHigh = ['B80', 'B80plus', 'B_unknown'].includes(a.budget);
  let type = ((a.format === 'turnkey' && budgetHigh) || (a.format === 'unsure' && a.budget === 'B80plus')) ? 'turnkey' : 'game';
  if (a.forceTurnkey) type = 'turnkey';
  const downsell = type === 'game' && a.format === 'turnkey' && (a.budget === 'B25' || a.budget === 'B40');
  const notes = [];
  const games = type === 'turnkey' ? [g] : [g].concat(pair);
  if (games.includes('guess')) notes.push('animals');
  if (type === 'game' && a.place === 'novenue') notes.push('venue');
  if (part2 === 'mk' && n > 10) notes.push('mkExtra');
  if (n > 30) notes.push('over30');
  const teaser = type === 'game' && !downsell && (n >= 16 || a.place === 'novenue');
  return { type, n, game: g, pair, pairPrice, part2, mk, mkPrice, downsell, notes, teaser };
}
function hotness(a, today) {
  if (a.date === 'D_exact' && a.dateValue) {
    const days = Math.round((Date.parse(a.dateValue) - Date.parse(today)) / 864e5);
    return days <= 31 ? 'ГАРЯЧА' : days <= 92 ? 'ТЕПЛА' : 'ХОЛОДНА';

${secondPart(r, g, pairName)}
<p class="small">У ціні команда, реквізит і дорога в межах Києва. Дату закріплюємо після передоплати 30%.</p>
${notes}
${r.teaser ? `<button class="teaser" data-act="teaser"><span class="s">Хочете, щоб локацію, декор і фото взяли на себе ми? Свято під ключ від ${money(TURNKEY_FROM)}&nbsp;грн.</span><span class="go">Подивитися</span></button>` : ''}
<div class="spacer"></div>${tail}</div>`;
  },
  form() {
    const ch = (v, t) => `<button type="button" class="chip" role="radio" data-act="msg" data-v="${v}" aria-checked="${F.messenger === v}">${t}</button>`;
    return `${topBar()}<div class="body"><h2 tabindex="-1">Куди надіслати візуалізацію?</h2>
<form id="lead" novalidate>
<div class="field"><label for="f-name">Ваше ім’я</label><input id="f-name" name="name" autocomplete="given-name" value="${esc(F.name)}" required><p class="err" id="e-name" hidden>Напишіть, як до вас звертатися.</p></div>
<div class="field"><label for="f-phone">Телефон</label><input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+380 (__) ___-__-__" value="${esc(F.phone)}" required><p class="err" id="e-phone" hidden>Потрібно 9 цифр після +380.</p></div>
<div class="field"><span class="flabel" id="l-msg">Де вам зручніше?</span><div class="chips" role="radiogroup" aria-labelledby="l-msg">${ch('telegram', 'Telegram')}${ch('viber', 'Viber')}${ch('whatsapp', 'WhatsApp')}${ch('call', 'Дзвінок')}</div><p class="err" id="e-msg" hidden>Оберіть, куди вам написати.</p></div>
<div class="field"><label for="f-kid">Ім’я іменинника</label><input id="f-kid" name="kid" value="${esc(F.kid)}"><span class="sub">Додамо у візуалізацію. Можна не заповнювати.</span></div>
<div class="field"><label for="f-comment">Коментар</label><textarea id="f-comment" name="comment" placeholder="Що любить іменинник, у що вже грали">${esc(F.comment)}</textarea></div>
<div class="hp" aria-hidden="true"><label for="f-site">Сайт</label><input id="f-site" name="website" tabindex="-1" autocomplete="off"></div>
<div id="f-fail" hidden></div>
<button class="btn" type="submit" id="f-send">Отримати візуалізацію</button>
<p class="small center">Натискаючи кнопку, ви погоджуєтесь, що менеджер ТОШО!? напише вам щодо свята.</p>
</form></div>`;
  },
  thanks() {
    return `<div class="logobar"><img class="logo" src="img/logo.svg" alt="ТОШО!? івент" width="160" height="39"></div>
<div class="body"><h2 tabindex="-1">Дякуємо, ${esc(F.name)}</h2>
<p class="lead">${thanksText()}</p>
<p class="small">Візуалізацію і кошторис надішлемо того ж вечора або наступного дня після розмови.</p>
${reviewsBlock()}
<div class="spacer"></div>
<a class="btn2" href="${esc(CONFIG.instagram)}" target="_blank" rel="noopener">Подивитися, як проходять наші ігри</a>
<button class="btn2" data-act="share">${shareLabel()}</button>
</div>`;
  },
  under8() {
    return `<div class="logobar"><img class="logo" src="img/logo.svg" alt="ТОШО!? івент" width="160" height="39"></div>
<div class="body"><h2 tabindex="-1">Поки рано</h2>
<p class="lead">Дякуємо, що зазирнули. Наші ігри написані для підлітків від 10 років. Будемо раді познайомитися, коли іменинник трохи підросте.</p>
<div class="spacer"></div>
<a class="btn" href="${esc(CONFIG.instagram)}" target="_blank" rel="noopener">Подивитися наш Instagram</a>
<button class="btn2" data-act="again">Почати спочатку</button>
</div>`;
  }
};
['age', 'age2', 'who', 'part2', 'guests', 'place', 'budget'].forEach(k => { R[k] = () => R.q(k); });

function kyivMinutes() {
  for (const tz of ['Europe/Kyiv', 'Europe/Kiev']) {
    try {
      const p = new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date());
      const h = +p.find(x => x.type === 'hour').value, m = +p.find(x => x.type === 'minute').value;
      return h * 60 + m;
    } catch (e) {}
  }
  const d = new Date(); return d.getHours() * 60 + d.getMinutes();
}
function thanksText() {
  const m = kyivMinutes(), call = F.messenger === 'call', where = L.messenger[F.messenger] || 'месенджер';
  if (m >= 540 && m < 1185) return call ? 'Менеджер подзвонить протягом 15 хвилин.' : `Менеджер напише вам у ${where} протягом 15 хвилин.`;
  const day = m < 540 ? 'сьогодні' : 'завтра';
  return call ? `Ми на зв’язку з 9:00 до 20:00, тож подзвонимо ${day} до 9:30.` : `Ми на зв’язку з 9:00 до 20:00, тож напишемо вам у ${where} ${day} до 9:30.`;
}

/* ====== НАВІГАЦІЯ ====== */
const STACK = [];
let canHist = true;
function show(name, push) {
  if (name === 'form' && A.sent) name = 'thanks';
  if (push !== false) {
    STACK.push({ s: name, ft: !!A.forceTurnkey });
    try { history.pushState({ s: name, ft: !!A.forceTurnkey }, ''); } catch (e) { canHist = false; }
  }
  const paint = () => {
    cur = name;
    view.innerHTML = R[name]();
    view.classList.remove('fade');
    window.scrollTo(0, 0);
    const h = view.querySelector('h1,h2'); if (h && name !== 'start') h.focus({ preventScroll: true });
    if (name === 'form') bindForm();
    if (Q[name] || ['format', 'vibe', 'date', 'mk'].includes(name)) track('QuizStep', { step: name, index: steps().indexOf(name === 'age2' ? 'age' : name === 'mk' ? 'part2' : name) + 1 });
    if (name === 'summary') { const r = compute(A); track('QuizSummary', { type: r.type, game: r.game, price: r.type === 'turnkey' ? TURNKEY_FROM : GAMES[r.game].price }); }
  };
  if (reduced || !view.innerHTML) return paint();
  view.classList.add('fade');
  setTimeout(paint, 180);
}
function goBack() {
  STACK.pop();
  const st = STACK[STACK.length - 1] || { s: 'start' };
  A.forceTurnkey = !!st.ft;
  show(st.s, false);
}
window.addEventListener('popstate', e => {
  STACK.pop();
  const st = e.state || STACK[STACK.length - 1] || { s: 'start' };
  A.forceTurnkey = !!st.ft;
  show(st.s || 'start', false);
});
function answer(q, v) {
  A.forceTurnkey = false;
  if (q === 'age' || q === 'age2') { A.age = v; }
  else { A[q] = v; }
  if (q === 'format' && v === 'turnkey') delete A.place;
  if (q === 'part2' && v !== 'mk') delete A.mk;
  if (q === 'date') { delete A.dateValue; A._dateOpen = false; }
  show(NEXT[q](v));
}

view.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'start') { track('QuizStart'); show('age'); }
  else if (act === 'ans') {
    view.querySelectorAll(`[data-q="${b.dataset.q}"]`).forEach(x => x.setAttribute('aria-pressed', x === b));
    setTimeout(() => answer(b.dataset.q, b.dataset.v), reduced ? 0 : 140);
  }
  else if (act === 'back') { if (canHist && STACK.length > 1) history.back(); else goBack(); }
  else if (act === 'dateknown') { A._dateOpen = true; view.innerHTML = R.date(); const d = document.getElementById('f-date'); if (d) d.focus(); }
  else if (act === 'datego') {
    const d = document.getElementById('f-date'), err = document.getElementById('e-date');
    if (!d.value || d.value < todayISO()) { err.hidden = false; d.setAttribute('aria-invalid', 'true'); return; }
    A.forceTurnkey = false; A.date = 'D_exact'; A.dateValue = d.value; show('budget');
  }
  else if (act === 'teaser') { A.forceTurnkey = true; show('summary'); }
  else if (act === 'toform') show('form');
  else if (act === 'share') share(b);
  else if (act === 'again') { A = {}; F = { name: '', phone: '', messenger: '', kid: '', comment: '' }; show('start'); }
  else if (act === 'msg') {
    F.messenger = b.dataset.v;
    view.querySelectorAll('[data-act="msg"]').forEach(x => x.setAttribute('aria-checked', x === b));
    document.getElementById('e-msg').hidden = true;
  }
});

function shareText() {
  const r = compute(A), g = GAMES[r.game];
  const item = r.type === 'turnkey' ? `свято під ключ, від ${money(TURNKEY_FROM)} грн` : `${g.name}, ${money(g.price)} грн`;
  return `Дивись, що нам радять у ТОШО!?: ${item}.`;
}
function share(btn) {
  const url = location.origin + location.pathname;
  const text = A.age ? shareText() : 'Свята для підлітків від 10 років у ТОШО!?.';
  const done = () => { const t = btn.textContent; btn.textContent = 'Скопійовано'; setTimeout(() => { btn.textContent = t; }, 1800); };
  if (navigator.share) { navigator.share({ title: 'ТОШО!?', text, url }).catch(() => {}); return; }
  if (navigator.clipboard) navigator.clipboard.writeText(text + ' ' + url).then(done).catch(() => {});
}

/* ====== ФОРМА ====== */
function phoneDigits(v) {
  let d = String(v).replace(/\D/g, '');
  if (d.startsWith('380')) d = d.slice(3); else if (d.startsWith('80')) d = d.slice(2); else if (d.startsWith('0')) d = d.slice(1);
  return d.slice(0, 9);
}
function phoneFormat(d) {
  if (!d) return '';
  let s = '+380 (' + d.slice(0, 2);
  if (d.length >= 2) s += ') ' + d.slice(2, 5);
  if (d.length >= 5) s += '-' + d.slice(5, 7);
  if (d.length >= 7) s += '-' + d.slice(7, 9);
  return s;
}
function bindForm() {
  const f = document.getElementById('lead');
  const ph = document.getElementById('f-phone');
  let lastD = phoneDigits(ph.value);
  ph.addEventListener('input', e => {
    let d = phoneDigits(ph.value);
    if (e.inputType && e.inputType.indexOf('delete') === 0 && d === lastD) d = d.slice(0, -1);
    ph.value = phoneFormat(d); lastD = d;
  });
  f.addEventListener('input', e => {
    const k = { 'f-name': 'name', 'f-phone': 'phone', 'f-kid': 'kid', 'f-comment': 'comment' }[e.target.id];
    if (k) { F[k] = e.target.value; e.target.removeAttribute('aria-invalid'); const er = document.getElementById('e-' + k); if (er) er.hidden = true; }
  });
  f.addEventListener('submit', e => { e.preventDefault(); submit(); });
}
// Назва програми точно як в аркуші «Прайс» (колонка «Програма» таблиці перевіряє значення за ним)
const PRICE_SHORT = { mafia: 'Мафія', trash: 'Треш-коктейль', stakes: 'Ставки', cuffs: 'Кайданки', guess: 'Вгадай' };
function priceItem(r) {
  if (r.type === 'turnkey') return 'Під ключ';
  if (r.part2 === 'mk') return GAMES[r.game].name + ' + МК';
  if (r.part2 === 'one') return GAMES[r.game].name;
  return r.pair.map(k => PRICE_SHORT[k]).join(' + ');
}
function payload() {
  const r = compute(A), g = GAMES[r.game];
  const pairName = r.pair.map(k => GAMES[k].name).join(' + ');
  const mkTxt = r.mk ? `МК «${MK[r.mk].name}»` : 'МК на вибір';
  const second = r.part2 === 'mk' ? `${g.name} + ${mkTxt} від ${money(r.mkPrice)}` : `${pairName} ${money(r.pairPrice)}`;
  const shown = r.type === 'turnkey'
    ? `під ключ від ${money(TURNKEY_FROM)}, програма ${g.name}${afterBreak(r) ? ', ' + afterBreak(r).toLowerCase().replace(/\.$/, '') : ''}`
    : `${g.name} ${money(g.price)} · ${second}`;
  const flags = [];
  if (r.type === 'turnkey') flags.push('ПІД КЛЮЧ');
  if (r.downsell) flags.push('хотіли під ключ');
  const fbc = cookie('_fbc') || (FBCLID ? `fb.1.${Date.now()}.${FBCLID}` : '');
  return {
    eventId: 'q' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
    createdAt: new Date().toISOString(),
    name: F.name.trim(), phone: '+380' + phoneDigits(F.phone), messenger: F.messenger,
    kidName: F.kid.trim(), comment: F.comment.trim(),
    website: (document.getElementById('f-site') || {}).value || '',
    answers: { age: A.age, who: A.who, format: A.format, vibe: A.vibe, part2: A.part2 || '', mk: A.mk || '', guests: A.guests, place: A.format === 'turnkey' ? '' : (A.place || ''), date: A.date, dateValue: A.dateValue || '', budget: A.budget },
    labels: {
      age: L.age[A.age] || '', who: L.who[A.who] || '', format: L.format[A.format] || '', vibe: L.vibe[A.vibe] || '',
      part2: A.part2 === 'mk' ? (MK[A.mk] ? 'майстер-клас «' + MK[A.mk].name + '»' : 'майстер-клас на вибір') : (L.part2[A.part2] || ''),
      guests: L.guests[A.guests] || '', place: A.format === 'turnkey' ? '' : (L.place[A.place] || ''),
      date: A.date === 'D_exact' ? dmy(A.dateValue) : (L.date[A.date] || ''), budget: L.budget[A.budget] || '',
      messenger: L.messenger[F.messenger] || ''
    },
    result: { type: r.type, priceItem: priceItem(r), game: r.game, gameName: g.name, gamePrice: g.price, pair: pairName, pairPrice: r.pairPrice, downsell: r.downsell, teaserUsed: !!A.forceTurnkey, notes: r.notes, shown },
    hot: hotness(A, todayISO()), flags,
    utm: UTM, fbclid: FBCLID, fbp: cookie('_fbp'), fbc,
    pageUrl: location.href, userAgent: navigator.userAgent
  };
}
async function submit() {
  let ok = true;
  const bad = (id, err) => { document.getElementById(id).setAttribute('aria-invalid', 'true'); document.getElementById(err).hidden = false; ok = false; };
  if (F.name.trim().length < 2) bad('f-name', 'e-name');
  if (phoneDigits(F.phone).length !== 9) bad('f-phone', 'e-phone');
  if (!F.messenger) { document.getElementById('e-msg').hidden = false; ok = false; }
  if (!ok) { const first = view.querySelector('[aria-invalid="true"]') || view.querySelector('[data-act="msg"]'); if (first) first.focus(); return; }
  const btn = document.getElementById('f-send'), fail = document.getElementById('f-fail');
  btn.disabled = true; btn.textContent = 'Надсилаємо…'; fail.hidden = true;
  const p = payload();
  try {
    if (CONFIG.endpoint) {
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 15000);
      const res = await fetch(CONFIG.endpoint, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(p), signal: ctl.signal });
      clearTimeout(t);
      const j = await res.json().catch(() => ({}));
      if (!res.ok || j.ok === false) throw new Error(j.error || 'HTTP ' + res.status);
    } else {
      await new Promise(r => setTimeout(r, 500));
    }
    track('Lead', { content_name: p.result.type }, true, { eventID: p.eventId });
    A.sent = true;
    show('thanks');
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Отримати візуалізацію';
    const links = [CONFIG.telegram && `<a class="btn2" href="${esc(CONFIG.telegram)}" target="_blank" rel="noopener">Написати в Telegram</a>`, `<a class="btn2" href="${esc(CONFIG.instagram)}" target="_blank" rel="noopener">Написати в Instagram</a>`].filter(Boolean).join('');
    const txt = `Заявка з квізу: ${p.name}, ${p.phone}, ${p.labels.messenger}. ${p.labels.age}, ${p.labels.who}, гравців ${p.labels.guests}. Показали: ${p.result.shown}.`;
    fail.className = 'fail';
    fail.innerHTML = `<p>Не вийшло надіслати. Напишіть нам, ми відповімо. Ваші відповіді скопіюємо, щоб ви вставили їх у повідомлення.</p>${links}`;
    fail.hidden = false;
    if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(() => {});
  }
}

/* ====== СТАРТ ====== */
document.getElementById('demo').hidden = !!CONFIG.endpoint;
initPixel();
try { history.replaceState({ s: 'start' }, ''); } catch (e) { canHist = false; }
STACK.push({ s: 'start', ft: false });
show('start', false);
</script>
